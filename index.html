<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Órbita · organizador pessoal</title>
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --bg:#0f1115;--bg2:#171a21;--bg3:#1f232c;--line:#2a2f3a;--tx:#e7e9ee;--tx2:#9aa1ad;
  --ac:#5b8cff;--ok:#3ecf8e;--warn:#f5b042;--bad:#ff5d5d;--well:#c77dff;--obr:#4cc9f0;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:rgba(15,17,21,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
header h1{font-size:17px;margin:0;flex:1;letter-spacing:.3px}
header h1 span{color:var(--tx2);font-weight:400;font-size:13px;margin-left:6px}
main{max-width:920px;margin:0 auto;padding:16px 16px 110px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;gap:4px;background:var(--bg2);
  border-top:1px solid var(--line);padding:6px 6px max(6px,env(safe-area-inset-bottom))}
nav button{flex:1;max-width:160px;background:none;border:0;padding:8px 4px;border-radius:10px;color:var(--tx2);cursor:pointer;font-size:13px}
nav button b{display:block;font-size:19px;line-height:1.1}
nav button.on{color:var(--tx);background:var(--bg3)}
h2{font-size:20px;margin:4px 0 12px}
h3{font-size:15px;margin:18px 0 8px;color:var(--tx2);text-transform:uppercase;letter-spacing:.6px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--tx2);font-size:13px}
.btn{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#3a4150}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.ghost{background:none;border-color:transparent}
.btn.danger{color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg3);border:1px solid var(--line);color:var(--tx2);white-space:nowrap}
.chip.late{color:var(--bad);border-color:#5a2a2a}
.chip.risk{color:var(--warn);border-color:#5a4520}
.chip.ok{color:var(--ok);border-color:#1f4a38}
.chip.well{color:var(--well);border-color:#4a2a63}
.chip.obr{color:var(--obr);border-color:#1d4555}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.task{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task .t{cursor:pointer}
.task.done .t{text-decoration:line-through;color:var(--tx2)}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid #475063;background:none;cursor:pointer;flex:none;margin-top:1px;display:grid;place-items:center;font-size:13px}
.chk.on{background:var(--ok);border-color:var(--ok);color:#06210f}
.list{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.empty{padding:14px;color:var(--tx2);font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--bg3);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--ac);border-radius:99px}
.bar.over i{background:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px}
.kpi{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.kpi b{display:block;font-size:22px}
.alert{border-left:3px solid var(--warn);padding:8px 12px;background:var(--bg2);border-radius:8px;margin-bottom:8px;font-size:14px}
.alert.bad{border-color:var(--bad)}
.alert.good{border-color:var(--ok)}
.alert.well{border-color:var(--well)}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.proj{cursor:pointer;border-left:4px solid var(--c,var(--ac))}
.quick{display:flex;gap:8px;margin-bottom:12px}
.quick input{flex:1}
input,select,textarea{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
textarea{min-height:140px;resize:vertical}
label{display:block;font-size:13px;color:var(--tx2);margin:10px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.grid7 input{padding:6px 4px;text-align:center}
dialog{background:var(--bg2);color:var(--tx);border:1px solid var(--line);border-radius:16px;padding:0;width:min(640px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog .hd{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg2);z-index:1}
dialog .hd b{flex:1;font-size:16px}
dialog .bd{padding:4px 16px 16px;overflow:auto}
dialog .ft{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)}
.timer{position:sticky;top:52px;z-index:4;background:#1b2a4a;border:1px solid #2c4a85;border-radius:12px;padding:8px 12px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.timer b{font-variant-numeric:tabular-nums}
.md h2,.md h3,.md h4{margin:10px 0 6px;color:var(--tx);text-transform:none;letter-spacing:0}
.md pre{background:var(--bg);padding:10px;border-radius:8px;overflow:auto}
.md code{background:var(--bg);padding:1px 5px;border-radius:5px}
.md a{color:var(--ac)}
.hbars{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:8px}
.hbars div{flex:1;display:flex;flex-direction:column-reverse;gap:2px;align-items:stretch}
.hbars span{display:block;border-radius:4px}
.hbars small{display:block;text-align:center;color:var(--tx2);font-size:11px;margin-top:4px}
.sync{font-size:12px;color:var(--tx2)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c,var(--ac));margin-right:6px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}.hide-sm{display:none}}
</style>
</head>
<body>
<header>
  <h1>Órbita<span id="hdate"></span></h1>
  <span class="sync" id="sync"></span>
  <button class="btn sm" data-a="settings" title="Configurações">⚙︎</button>
</header>
<main id="view"></main>
<nav id="nav">
  <button data-a="go" data-id="hoje"><b>☀︎</b>Hoje</button>
  <button data-a="go" data-id="projetos"><b>◆</b>Projetos</button>
  <button data-a="go" data-id="conhecimento"><b>✎</b>Conhecimento</button>
  <button data-a="go" data-id="balanco"><b>◐</b>Balanço</button>
</nav>
<dialog id="dlg"></dialog>

<script>
"use strict";
/* ======================= Utilidades ======================= */
const KEY = "orbita.v1", GHKEY = "orbita.gh";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const iso = d => { const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 10); };
const today = () => iso(new Date());
const addDays = (ds, n) => { const d = new Date(ds + "T12:00:00"); d.setDate(d.getDate() + n); return iso(d); };
const dow = ds => new Date(ds + "T12:00:00").getDay(); // 0 = domingo
const weekStart = ds => addDays(ds, -((dow(ds) + 6) % 7)); // segunda
const fmtH = h => { h = Math.max(0, h || 0); if (h < 1) return Math.round(h * 60) + "min"; const m = Math.round((h % 1) * 60); return Math.floor(h) + "h" + (m ? String(m).padStart(2, "0") : ""); };
const fmtD = ds => { if (!ds) return ""; const t = today(); if (ds === t) return "hoje"; if (ds === addDays(t, 1)) return "amanhã"; if (ds === addDays(t, -1)) return "ontem";
  const d = new Date(ds + "T12:00:00"); return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "short" }).replace(".", ""); };
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : 0; };
const DIAS = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const KINDS = { projeto: "Projeto", obrigacao: "Obrigação", bemestar: "Bem-estar" };
const STATUS = { ideia: "Ideia", backlog: "Backlog", ativo: "Ativo", pausado: "Pausado", concluido: "Concluído" };
const COLORS = ["#5b8cff","#3ecf8e","#f5b042","#ff5d5d","#c77dff","#4cc9f0","#ff8fab","#a3e635"];

/* ======================= Estado ======================= */
function blank() {
  const P = (name, area, color) => ({ id: uid(), name, area, status: "backlog", color, goal: "", deadline: "", notes: "", created: today() });
  const projects = [
    P("IA - Jarvis", "IA · API · IoT", COLORS[0]),
    P("Miniatura carro autônomo", "Visão · Controle · PCB", COLORS[1]),
    P("FADEC", "Controle · Aero · PCB", COLORS[2]),
    P("Braço Robótico Semi Profissional", "Robótica · Visão", COLORS[3]),
    P("Drone Asa Fixa", "Aero · Controle", COLORS[4]),
    P("Triangulação - 3 pontos", "RF · Localização", COLORS[5]),
    P("Estação Meteorológica - Jaraguá", "IoT · PCB", COLORS[6]),
    P("Capacete Homem de Ferro", "Mecânica · Servos", COLORS[7]),
  ];
  return {
    version: 1, updated: 0,
    settings: { hours: [3, 3, 3, 3, 3, 3, 4], wellPct: 20 },
    projects,
    tasks: [{ id: uid(), title: "Explorar o Órbita e cadastrar minhas tarefas", projectId: "", kind: "obrigacao", estimate: 0.25, spent: 0, due: today(), plan: today(), status: "todo", created: today(), doneAt: "" }],
    habits: [
      { id: uid(), name: "Exercício físico", target: 3, minutes: 45, log: [] },
      { id: uid(), name: "Leitura / estudo livre", target: 3, minutes: 30, log: [] },
      { id: uid(), name: "Tempo com amigos ou família", target: 2, minutes: 90, log: [] },
      { id: uid(), name: "Hobby sem objetivo (jogo, música, rolê)", target: 2, minutes: 60, log: [] },
    ],
    notes: [{ id: uid(), projectId: "", title: "Como usar o Órbita", tags: ["guia"], updated: today(),
      body: "## Ideia\n- **Hoje**: o que fazer agora, quanto cabe no seu dia e o que está atrasando.\n- **Projetos**: backlog e previsão de término de cada projeto.\n- **Conhecimento**: datasheets, decisões, cálculos e links, ligados ao projeto.\n- **Balanço**: para onde foi seu tempo e se você está cuidando de você.\n\n## Estimativas\nMarque o tempo real com o ▶︎ em cada tarefa. O Órbita aprende quanto você erra nas estimativas e corrige as próximas automaticamente.\n\n## Atalho de criação rápida\n`Soldar placa 1.5h #carro` → estimativa de 1h30 no projeto que começa com \"carro\"." }],
    log: [], timer: null,
  };
}
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.version) return migrate(s); } catch (e) {} return blank(); }
function migrate(s) { const b = blank(); s.settings = Object.assign(b.settings, s.settings || {}); for (const k of ["projects","tasks","habits","notes","log"]) s[k] = s[k] || []; return s; }
let S = load();
let view = location.hash.slice(1) || "hoje";
let ui = { projFilter: "ativos", noteQ: "", noteTag: "" };
function save(sync = true) { S.updated = Date.now(); localStorage.setItem(KEY, JSON.stringify(S)); if (sync) Sync.schedule(); render(); }

/* ======================= Inteligência de tempo ======================= */
// Fator de calibração: quanto o tempo real costuma passar da estimativa
function calib() {
  const d = S.tasks.filter(t => t.status === "done" && t.estimate > 0 && t.spent > 0).slice(-30);
  if (d.length < 3) return { f: 1, n: d.length };
  const f = d.reduce((a, t) => a + t.spent, 0) / d.reduce((a, t) => a + t.estimate, 0);
  return { f: Math.min(Math.max(f, 0.5), 3), n: d.length };
}
const remaining = (t, f = calib().f) => t.status === "done" ? 0 : Math.max((t.estimate || 0.5) * f - (t.spent || 0), 0.25);
const hoursOn = ds => num(S.settings.hours[dow(ds)]);
const projHoursOn = ds => hoursOn(ds) * (1 - S.settings.wellPct / 100);

function taskState(t) {
  if (t.status === "done") return "done";
  const td = today();
  if (t.due && t.due < td) return "late";
  if (t.due) {
    let cap = 0, g = 0;
    for (let d = td; d <= t.due && g < 400; d = addDays(d, 1), g++) cap += projHoursOn(d);
    const f = calib().f;
    const load = S.tasks.filter(x => x.status !== "done" && x.due && x.due <= t.due && x.kind !== "bemestar").reduce((a, x) => a + remaining(x, f), 0);
    if (load > cap) return "risk";
  }
  return "ok";
}
function forecast(p) {
  const f = calib().f;
  const all = S.tasks.filter(t => t.projectId === p.id);
  const open = all.filter(t => t.status !== "done");
  const rem = open.reduce((a, t) => a + remaining(t, f), 0);
  const done = all.length - open.length;
  let end = null, state = "ok";
  if (rem > 0 && p.status === "ativo") {
    const active = Math.max(1, S.projects.filter(x => x.status === "ativo").length);
    let d = today(), left = rem, g = 0;
    while (g++ < 730) { left -= projHoursOn(d) / active; if (left <= 0.01) break; d = addDays(d, 1); }
    end = d;
  }
  if (p.deadline && p.status !== "concluido") {
    if (p.deadline < today()) state = "late";
    else if (end && end > p.deadline) state = "risk";
    else if (!end && rem > 0) state = "risk";
  }
  return { rem, end, state, done, total: all.length, pct: all.length ? done / all.length : 0 };
}
function habitWeek(h) {
  const ws = weekStart(today()), we = addDays(ws, 6);
  const count = h.log.filter(d => d >= ws && d <= we).length;
  const dayIdx = (dow(today()) + 6) % 7 + 1; // 1..7
  const expected = Math.floor(h.target * dayIdx / 7);
  return { count, left: Math.max(0, h.target - count), behind: count < expected, doneToday: h.log.includes(today()), daysLeft: 7 - dayIdx + 1 };
}
function alerts() {
  const out = [], td = today(), f = calib();
  const late = S.tasks.filter(t => taskState(t) === "late"), risk = S.tasks.filter(t => taskState(t) === "risk");
  if (late.length) out.push({ c: "bad", t: `${late.length} tarefa(s) atrasada(s): ${late.slice(0, 3).map(t => esc(t.title)).join(", ")}${late.length > 3 ? "…" : ""}` });
  if (risk.length) out.push({ c: "", t: `${risk.length} tarefa(s) em risco: não cabem no seu tempo até o prazo. Reduza o escopo, mova o prazo ou troque prioridades.` });
  for (const p of S.projects) { const fc = forecast(p);
    if (fc.state === "late") out.push({ c: "bad", t: `Projeto <b>${esc(p.name)}</b> passou do prazo (${fmtD(p.deadline)}).` });
    else if (fc.state === "risk") out.push({ c: "", t: `Projeto <b>${esc(p.name)}</b>: previsão ${fc.end ? fmtD(fc.end) : "indefinida"} > prazo ${fmtD(p.deadline)}.` }); }
  const behind = S.habits.filter(h => habitWeek(h).behind);
  if (behind.length) out.push({ c: "well", t: `Você está deixando de lado: <b>${behind.map(h => esc(h.name)).join(", ")}</b>. Isso também é prioridade.` });
  const act = S.projects.filter(p => p.status === "ativo").length;
  if (act > 2) out.push({ c: "", t: `${act} projetos ativos ao mesmo tempo. Com seu tempo disponível, focar em 1 ou 2 termina tudo mais rápido.` });
  if (f.n >= 3 && f.f > 1.25) out.push({ c: "", t: `Você costuma levar <b>${f.f.toFixed(2)}×</b> o tempo que estima. As previsões já estão corrigidas por isso.` });
  if (!out.length) out.push({ c: "good", t: "Tudo em dia. Bom momento para puxar algo do backlog ou descansar sem culpa." });
  return out;
}
function autoPlan() {
  const td = today(), f = calib().f, cap = projHoursOn(td);
  const prio = t => ({ late: 0, risk: 1, ok: 2 }[taskState(t)] * 1e6 + (t.due ? (new Date(t.due) - new Date(td)) / 864e5 : 9e5) - (S.projects.find(p => p.id === t.projectId)?.status === "ativo" ? 1000 : 0));
  const cand = S.tasks.filter(t => t.status !== "done" && t.kind !== "bemestar").sort((a, b) => prio(a) - prio(b));
  let used = S.tasks.filter(t => t.plan === td && t.status !== "done").reduce((a, t) => a + remaining(t, f), 0), n = 0;
  for (const t of cand) { if (t.plan === td) continue; const r = remaining(t, f); if (used + r > cap && taskState(t) !== "late") continue; t.plan = td; used += r; n++; }
  save();
  toast(n ? `${n} tarefa(s) puxadas para hoje.` : "Seu dia já está cheio ou não há tarefas candidatas.");
}

/* ======================= Views ======================= */
const kindChip = k => k === "bemestar" ? `<span class="chip well">bem-estar</span>` : k === "obrigacao" ? `<span class="chip obr">obrigação</span>` : "";
const stateChip = t => { const s = taskState(t); return s === "late" ? `<span class="chip late">atrasada</span>` : s === "risk" ? `<span class="chip risk">em risco</span>` : ""; };
const projOf = id => S.projects.find(p => p.id === id);
function taskRow(t, opts = {}) {
  const p = projOf(t.projectId), f = calib().f, running = S.timer && S.timer.taskId === t.id;
  return `<div class="task ${t.status === "done" ? "done" : ""}">
    <button class="chk ${t.status === "done" ? "on" : ""}" data-a="toggleTask" data-id="${t.id}">${t.status === "done" ? "✓" : ""}</button>
    <div class="grow">
      <div class="t" data-a="editTask" data-id="${t.id}">${esc(t.title)}</div>
      <div class="chips" style="margin-top:4px">
        ${p && !opts.noProj ? `<span class="chip"><span class="dot" style="--c:${p.color}"></span>${esc(p.name)}</span>` : ""}
        ${kindChip(t.kind)}${stateChip(t)}
        ${t.estimate ? `<span class="chip" title="estimativa corrigida pelo seu histórico">${t.status === "done" ? "levou " + fmtH(t.spent) : "≈ " + fmtH(remaining(t, f)) + " restante"}</span>` : ""}
        ${t.due ? `<span class="chip">prazo ${fmtD(t.due)}</span>` : ""}
      </div>
    </div>
    ${t.status !== "done" ? `<button class="btn sm ${running ? "pri" : ""}" data-a="${running ? "stopTimer" : "startTimer"}" data-id="${t.id}" title="cronometrar">${running ? "■" : "▶︎"}</button>` : ""}
  </div>`;
}
function timerBar() {
  if (!S.timer) return "";
  const t = S.tasks.find(x => x.id === S.timer.taskId); if (!t) return "";
  return `<div class="timer"><span>⏱</span><div class="grow">${esc(t.title)}</div><b id="tclock">00:00</b><button class="btn sm" data-a="stopTimer" data-id="${t.id}">Parar</button></div>`;
}

function vHoje() {
  const td = today(), f = calib().f;
  const late = S.tasks.filter(t => t.status !== "done" && t.due && t.due < td);
  const plan = S.tasks.filter(t => (t.plan === td || t.due === td || (t.status === "done" && t.doneAt === td)) && !late.includes(t));
  plan.sort((a, b) => (a.status === "done") - (b.status === "done"));
  const load = [...late, ...plan].filter(t => t.status !== "done").reduce((a, t) => a + remaining(t, f), 0);
  const cap = hoursOn(td), pcap = projHoursOn(td);
  const pct = Math.min(100, (load / Math.max(pcap, 0.01)) * 100);
  const nextUp = S.tasks.filter(t => t.status !== "done" && t.due && t.due > td && t.due <= addDays(td, 7) && t.plan !== td).sort((a, b) => a.due.localeCompare(b.due));
  return `${timerBar()}
  <div class="quick"><input id="qadd" placeholder="Nova tarefa pra hoje… ex.: Rotear PCB 2h #carro" data-enter="quickAdd"><button class="btn pri" data-a="quickAdd">+</button></div>
  <div class="card">
    <div class="row"><div class="grow"><b>${fmtH(load)}</b> planejadas de <b>${fmtH(pcap)}</b> para projetos e obrigações <span class="muted">(${fmtH(cap)} no dia, ${S.settings.wellPct}% reservado para você)</span></div></div>
    <div class="bar ${load > pcap ? "over" : ""}" style="margin-top:8px"><i style="width:${pct}%"></i></div>
    ${load > pcap ? `<div class="muted" style="margin-top:6px;color:var(--warn)">Seu dia está ${fmtH(load - pcap)} acima do que cabe. Escolha o que adiar: é melhor decidir agora do que se frustrar à noite.</div>` : ""}
    <div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap"><button class="btn sm" data-a="autoPlan">✨ Montar meu dia</button><button class="btn sm" data-a="newTask">+ Tarefa detalhada</button></div>
  </div>

/* ======================= Sincronização GitHub ======================= */
const Sync = {
  sha: null, timerId: null, busy: false,
  cfg() { try { return JSON.parse(localStorage.getItem(GHKEY)) || {}; } catch (e) { return {}; } },
  on() { const c = this.cfg(); return !!(c.repo && c.token); },
  status(msg) { $("#sync").textContent = msg ?? (this.on() ? "☁︎ GitHub" : "local"); },
  b64e(s) { const b = new TextEncoder().encode(s); let bin = ""; for (let i = 0; i < b.length; i += 8192) bin += String.fromCharCode.apply(null, b.subarray(i, i + 8192)); return btoa(bin); },
  b64d(s) { const bin = atob(s.replace(/\s/g, "")); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); },
  async req(method, body) {
    const c = this.cfg();
    return fetch(`https://api.github.com/repos/${c.repo}/contents/${encodeURIComponent(c.path || "data.json")}`, {
      method, cache: "no-store", body: body ? JSON.stringify(body) : undefined,
      headers: { Authorization: "Bearer " + c.token, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" } });
  },
  async pull(force = false) {
    if (!this.on()) return; this.status("⟳ puxando…");
    try {
      const r = await this.req("GET");
      if (r.status === 404) { this.sha = null; await this.push(); return; }
      if (!r.ok) throw new Error(r.status);
      const j = await r.json(); this.sha = j.sha;
      const remote = JSON.parse(this.b64d(j.content));
      if (force || (remote.updated || 0) > (S.updated || 0)) { S = migrate(remote); localStorage.setItem(KEY, JSON.stringify(S)); render(); this.status("✓ atualizado"); }
      else if ((S.updated || 0) > (remote.updated || 0)) await this.push();
      else this.status("✓ em dia");
    } catch (e) { this.status("⚠ sync " + e.message); }
  },
  async push() {
    if (!this.on() || this.busy) return; this.busy = true; this.status("⟳ enviando…");
    try {
      const body = { message: "orbita: " + new Date().toISOString(), content: this.b64e(JSON.stringify(S, null, 1)) };
      if (this.sha) body.sha = this.sha;
      let r = await this.req("PUT", body);
      if (r.status === 409 || r.status === 422) { const g = await this.req("GET"); if (g.ok) { this.sha = (await g.json()).sha; body.sha = this.sha; r = await this.req("PUT", body); } }
      if (!r.ok) throw new Error(r.status);
      this.sha = (await r.json()).content.sha; this.status("✓ salvo");
    } catch (e) { this.status("⚠ sync " + e.message); }
    this.busy = false;
  },
  schedule() { if (!this.on()) return; clearTimeout(this.timerId); this.timerId = setTimeout(() => this.push(), 2500); },
};

  quickAdd: () => {

    let est = 1, proj = "";
    s = s.replace(/(\d+(?:[.,]\d+)?)\s*(h|min)\b/i, (m, n, u) => { est = u.toLowerCase() === "min" ? num(n) / 60 : num(n); return ""; });
    s = s.replace(/#(\S+)/, (m, q) => { const p = S.projects.find(p => p.name.toLowerCase().includes(q.toLowerCase())); if (p) proj = p.id; return ""; });
    S.tasks.push({ id: uid(), title: s.trim().replace(/\s+/g, " "), projectId: proj, kind: "projeto", estimate: est, spent: 0, due: "", plan: today(), status: "todo", created: today(), doneAt: "" });
    el.value = ""; save();
  },
  newTask: () => taskForm(),
  newTaskFor: id => { dlg.close(); taskForm(); setTimeout(() => { const s = dlg.querySelector('[name=projectId]'); if (s) s.value = id; }, 0); },
  editTask: id => { dlg.close(); taskForm(S.tasks.find(t => t.id === id)); },
  delTask: id => { if (!confirm("Excluir esta tarefa?")) return; S.tasks = S.tasks.filter(t => t.id !== id); dlg.close(); save(); },
  toggleTask: id => { const t = S.tasks.find(t => t.id === id); if (!t) return;
    if (S.timer && S.timer.taskId === id) A.stopTimer(id, null, null, true);
    t.status = t.status === "done" ? "todo" : "done"; t.doneAt = t.status === "done" ? today() : "";
    if (t.status === "done" && !t.spent && t.estimate) t.spent = 0; save(); if (dlg.open) { const p = projOf(t.projectId); if (p) projectForm(p); } },
  startTimer: id => { if (S.timer) A.stopTimer(S.timer.taskId, null, null, true); S.timer = { taskId: id, start: Date.now() }; const t = S.tasks.find(t => t.id === id); if (t && !t.plan) t.plan = today(); save(); },
  stopTimer: (id, el, ev, silent) => { if (!S.timer) return; const t = S.tasks.find(t => t.id === S.timer.taskId); const h = (Date.now() - S.timer.start) / 3.6e6;
    if (t && h > 0.005) { t.spent = (t.spent || 0) + h; S.log.push({ date: today(), taskId: t.id, hours: h, kind: t.kind }); }
    S.timer = null; if (!silent) { save(); toast("+" + fmtH(h) + " registrado"); } },
  autoPlan: () => autoPlan(),
  toggleHabit: id => { const h = S.habits.find(h => h.id === id), td = today(); h.log = h.log.includes(td) ? h.log.filter(d => d !== td) : [...h.log, td]; save(); },
  newHabit: () => habitForm(),
  editHabit: id => habitForm(S.habits.find(h => h.id === id)),
  delHabit: id => { if (!confirm("Excluir?")) return; S.habits = S.habits.filter(h => h.id !== id); dlg.close(); save(); },
  projFilter: id => { ui.projFilter = id; render(); },
  newProject: () => projectForm(),
  openProject: id => projectForm(projOf(id)),
  delProject: id => { if (!confirm("Excluir o projeto? As tarefas e notas ficam, só perdem o vínculo.")) return; S.projects = S.projects.filter(p => p.id !== id);
    S.tasks.forEach(t => { if (t.projectId === id) t.projectId = ""; }); S.notes.forEach(n => { if (n.projectId === id) n.projectId = ""; }); dlg.close(); save(); },
  newNote: () => noteForm(),
  newNoteFor: id => { dlg.close(); noteForm(null, id); },
  editNote: id => { dlg.close(); noteForm(S.notes.find(n => n.id === id)); },
  delNote: id => { if (!confirm("Excluir esta nota?")) return; S.notes = S.notes.filter(n => n.id !== id); dlg.close(); save(); },
  noteTag: id => { ui.noteTag = id; render(); },
  preview: () => { const p = $("#nprev"), b = $("#nbody"); const on = p.style.display === "none"; p.style.display = on ? "block" : "none"; b.style.display = on ? "none" : "block"; if (on) p.innerHTML = md(b.value); },
  syncPull: () => { saveGhFromForm(); Sync.pull(true); },
  syncPush: () => { saveGhFromForm(); Sync.push(); },
  export: () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], { type: "application/json" })); a.download = `orbita-${today()}.json`; a.click(); },
  reset: () => { if (!confirm("Apagar TODOS os dados deste aparelho? (o GitHub não é afetado até a próxima alteração)")) return; S = blank(); dlg.close(); save(false); },
};
function saveGhFromForm() {
  const f = dlg.querySelector("[name=repo]"); if (!f) return;
  const v = n => (dlg.querySelector(`[name=${n}]`).value || "").trim();
  localStorage.setItem(GHKEY, JSON.stringify({ repo: v("repo"), path: v("path") || "data.json", token: v("token") }));
}
function md(s) {
  const code = []; let h = esc(s).replace(/```([\s\S]*?)```/g, (m, c) => { code.push(c); return `\u0000${code.length - 1}\u0000`; });
  h = h.replace(/^### (.*)$/gm, "<h4>$1</h4>").replace(/^## (.*)$/gm, "<h3>$1</h3>").replace(/^# (.*)$/gm, "<h2>$1</h2>")
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/^- (.*)$/gm, "• $1").replace(/\n/g, "<br>");
  return h.replace(/\u0000(\d+)\u0000/g, (m, i) => `<pre><code>${code[i]}</code></pre>`);
}
document.addEventListener("click", e => { const el = e.target.closest("[data-a]"); if (!el) return;
  if (el.closest(".task") && el.classList.contains("task") && e.target.closest("button")) return;
  e.preventDefault(); e.stopPropagation(); const f = A[el.dataset.a]; if (f) f(el.dataset.id, el, e); });
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.dataset && e.target.dataset.enter) { e.preventDefault(); A[e.target.dataset.enter](); } });
document.addEventListener("input", e => { if (e.target.dataset && e.target.dataset.input) { ui[e.target.dataset.input] = e.target.value; render(); } });
document.addEventListener("change", e => { if (e.target.dataset && e.target.dataset.change === "import") { const f = e.target.files[0]; if (!f) return;
  f.text().then(t => { try { const d = JSON.parse(t); if (!d.version) throw 0; S = migrate(d); dlg.close(); save(); toast("importado"); } catch (x) { alert("Arquivo inválido."); } }); } });
window.addEventListener("hashchange", () => { view = location.hash.slice(1) || "hoje"; render(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { render(); Sync.pull(); } });

render(); Sync.status(); Sync.pull();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
